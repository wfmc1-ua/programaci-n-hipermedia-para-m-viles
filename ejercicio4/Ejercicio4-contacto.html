<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar build a revisar</title>

  <!-- 1. Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- 2. FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <!-- 3. Tus estilos (SIEMPRE el último) -->
  <link rel="stylesheet" href="Ejercicio4.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container">

            <!-- Logo + nombre -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="Ejercicio4.html">
                <img src="img/logo.jpeg" alt="Logo Guía del Cazador" height="40">
                Guía del Cazador
            </a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false"
                    aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido que se contrae -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                    <a class="nav-link"  href="Ejercicio4.html">
                        <i class="fa-solid fa-house"></i> Inicio
                    </a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link" href="Ejercicio4-monstruos.html">
                        <i class="fa-solid fa-dragon"></i> Monstruos
                    </a>
                    </li>
                    <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="Ejercicio4-contacto.html">
                        <i class="fa-solid fa-scroll"></i> Envía tu build
                    </a>
                    </li>
                </ul>

                <!-- Buscador (no funcional) -->
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar monstruo..." aria-label="Buscar">
                    <button class="btn btn-outline-warning" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

            </div>
        </div>
    </nav>

  <main class="container my-4">
    <section class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="mb-1">Envía tu build</h1>
            <p class="text-body-secondary mb-0">Comparte tu equipo con otros cazadores.</p>
        </div>

        <div class="dropdown">
            <button class="btn btn-outline-dark dropdown-toggle" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-lightbulb"></i> Builds de ejemplo
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Espada larga – Crítico</a></li>
            <li><a class="dropdown-item" href="#">Arco – Elemental</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Lanza – Tanque</a></li>
            </ul>
        </div>
    </section>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <form class="border rounded p-4">

            <!-- Nombre -->
            <div class="row mb-3">
                <label for="nombre" class="col-sm-3 col-form-label">
                <i class="fa-solid fa-user"></i> Cazador
                </label>
                <div class="col-sm-9">
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre de cazador">
                </div>
            </div>

            <!-- Email -->
            <div class="row mb-3">
                <label for="email" class="col-sm-3 col-form-label">
                <i class="fa-solid fa-envelope"></i> Email
                </label>
                <div class="col-sm-9">
                <input type="email" class="form-control" id="email" placeholder="cazador@gremio.com">
                </div>
            </div>

            <!-- SELECT (desplegable de formulario) -->
            <div class="row mb-3">
                <label for="arma" class="col-sm-3 col-form-label">
                <i class="fa-solid fa-khanda"></i> Arma
                </label>
                <div class="col-sm-9">
                <select class="form-select" id="arma">
                    <option selected disabled>Elige tu arma...</option>
                    <option>Gran espada</option>
                    <option>Espada larga</option>
                    <option>Espada y escudo</option>
                    <option>Martillo</option>
                    <option>Lanza</option>
                    <option>Arco</option>
                </select>
                </div>
            </div>

            <!-- Radios -->
            <fieldset class="row mb-3">
                <legend class="col-sm-3 col-form-label pt-0">Estilo</legend>
                <div class="col-sm-9">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="estilo" id="ofensivo" checked>
                    <label class="form-check-label" for="ofensivo">Ofensivo</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="estilo" id="defensivo">
                    <label class="form-check-label" for="defensivo">Defensivo</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="estilo" id="apoyo">
                    <label class="form-check-label" for="apoyo">Apoyo</label>
                </div>
                </div>
            </fieldset>

            <!-- Descripción -->
            <div class="row mb-3">
                <label for="descripcion" class="col-sm-3 col-form-label">Descripción</label>
                <div class="col-sm-9">
                <textarea class="form-control" id="descripcion" rows="4"
                            placeholder="Habilidades, adornos, contra qué monstruo funciona..."></textarea>
                </div>
            </div>

            <!-- Checkbox -->
            <div class="row mb-4">
                <div class="col-sm-9 offset-sm-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="publicar">
                    <label class="form-check-label" for="publicar">Publicar en la comunidad</label>
                </div>
                </div>
            </div>

            <!-- Botones -->
            <div class="row">
                <div class="col-sm-9 offset-sm-3 d-flex gap-2">
                <button type="submit" class="btn btn-warning">
                    <i class="fa-solid fa-paper-plane"></i> Enviar
                </button>
                <button type="reset" class="btn btn-outline-secondary">
                    <i class="fa-solid fa-xmark"></i> Cancelar
                </button>
                </div>
            </div>

            </form>
        </div>
    </div>
  </main>

  <!-- Bootstrap JS (al final del body) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

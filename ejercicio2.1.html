<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio 2.1 - Offset, ordenación y visibilidad</title>

    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
      :root {
        --color-rojo: #FF0000;
        --color-verde: #00FF00;
        --color-cian: #00CCFF;
        --color-naranja: #FF9900;
        --color-amarillo: #FFFF00;
        --color-borde: #000000;
      }

      .bg-rojo     { background-color: var(--color-rojo); }
      .bg-verde    { background-color: var(--color-verde); }
      .bg-cian     { background-color: var(--color-cian); }
      .bg-naranja  { background-color: var(--color-naranja); }
      .bg-amarillo { background-color: var(--color-amarillo); }

      .bloque {
        border: 1px solid var(--color-borde);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">

      <div class="row"> 
        <div class="col-12 bg-rojo  bloque">Header</div>
      </div>

      <div class="row"> 
        <div class="col-6 col-sm-3 bg-verde  offset-md-3 bloque">1</div>
        <div class="col-6 col-sm-3 bg-verde  bloque">2</div>
        <div class="w-100 d-sm-none"></div>
        <div class="col-6 col-sm-3 bg-verde   bloque">3</div>

        <div class="col-6 col-sm-3 bg-verde  offset-md-6 bloque">4</div>

      </div>

      <div class="row">
        <div class="col-12 d-md-none d-none d-sm-block bg-naranja bloque">Tablet</div>
      </div>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>

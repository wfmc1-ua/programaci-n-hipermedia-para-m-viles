<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Demo</title>
    
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Tu bloque de estilos personalizado -->
    <style>
      :root {
        --color-rojo: #FF0000;
        --color-verde: #00FF00;
        --color-naranja: #FF9900;
        --color-azul: #66A3E0;
        --color-borde: #000000;
      }

      .bg-rojo {
        background-color: var(--color-rojo);
      }

      .bg-verde {
        background-color: var(--color-verde);
      }

      .bg-naranja {
        background-color: var(--color-naranja);
      }

      .bg-azul {
        background-color: var(--color-azul);
      }

      .bloque {
        border: 2px solid var(--color-borde);
        min-height: 50px; /* Altura mínima para visualizar los bloques vacíos */
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
    
        <div class="row">
        <div class="col-12 bg-rojo bloque"></div>
    
    </div>
    <div class="row">
        <div class = "col-12 col-sm-3 col-md-2  bg-verde bloque"></div>
            <div class = "col-12 col-sm-9 col-md-10">

                <div class="row">
                    <div class="col-12 col-md-6 bg-naranja bloque"></div>
                    <div class="col-12 col-md-6 bg-naranja bloque"></div>
                </div>

                
                
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-5">
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
                <div class="col bg-azul bloque"></div>
            </div>
        </div>
    </div>
    
        <div class = "row">
             <div class = "col-12 bg-rojo bloque"</div>

    </div>
    
  </body>
</html>
